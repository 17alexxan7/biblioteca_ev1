name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests unitarios
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ejecutar tests con Maven Wrapper
        run: ./mvnw -B clean test

      - name: Subir reportes de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore

  security:
    name: Análisis de seguridad (Snyk)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configurar Node (para Snyk CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar módulos en el repo local (Snyk necesita resolver common)
        run: ./mvnw -B -q install -DskipTests

      - name: Instalar Snyk CLI
        run: npm install -g snyk

      - name: Snyk test (bloquea si hay vulnerabilidades high o critical)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --policy-path=.snyk --severity-threshold=high --json-file-output=snyk-report.json

      - name: Subir reporte de Snyk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: snyk-report.json
          if-no-files-found: ignore

  docker:
    name: Build imagen Docker (${{ matrix.module }})
    runs-on: ubuntu-latest
    needs: security
    strategy:
      fail-fast: false
      matrix:
        module: [eureka, ms-usuarios, ms-catalogo, ms-recursos, api-gateway]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: MODULE=${{ matrix.module }}
          tags: biblioteca-${{ matrix.module }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}

  deploy:
    name: Deploy simulado (Docker Compose)
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Generar .env efímero
        run: |
          echo "MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)" > .env
          echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> .env

      - name: Levantar el stack y esperar healthchecks
        run: docker compose up -d --build --wait --wait-timeout 400

      - name: Smoke test al API Gateway
        run: curl --fail --silent --show-error http://localhost:9000/actuator/health

      - name: Logs del stack si algo falló
        if: failure()
        run: docker compose logs --tail=100

      - name: Bajar el stack
        if: always()
        run: docker compose down -v