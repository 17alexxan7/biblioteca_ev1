version: 2
updates:
  - package-ecosystem: "maven"
    directories:
      - "/"
      - "/common"
      - "/eureka"
      - "/ms-usuarios"
      - "/ms-catalogo"
      - "/ms-recursos"
      - "/api-gateway"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"